<!DOCTYPE html>
<html>
<head>
    <title>Booking Confirmed</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #00c9ff, #92fe9d);
            margin: 0;
        }

        .card {
            width: 350px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        .success-icon {
            font-size: 50px;
            color: green;
        }

        h2 {
            margin-bottom: 20px;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #00c9ff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0099cc;
        }
    </style>

</head>

<body>

<div class="card">
    <div class="success-icon">✅</div>
    <h2>Booking Confirmed!</h2>

    <div class="details">
        <p><strong>Pickup:</strong> <span th:text="${booking.pickup}"></span></p>
        <p><strong>Drop:</strong> <span th:text="${booking.dropLocation}"></span></p>
        <p class="price"><strong>Fare:</strong> ₹<span th:text="${booking.price}"></span></p>
    </div>

    <button onclick="window.location.href='/'">🏠 Back to Home</button>
</div>

</body>
</html>
