<!DOCTYPE html>
<html>
<head>
    <title>Login - SmartCab</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            margin: 0;
        }

        .login-box {
            width: 350px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .icon {
            font-size: 40px;
        }

        .footer {
            margin-top: 10px;
            font-size: 14px;
        }

        .footer a {
            text-decoration: none;
            color: #667eea;
        }
    </style>

    <script>
        function validateLogin() {
            let user = document.forms["loginForm"]["username"].value;
            let pass = document.forms["loginForm"]["password"].value;

            if (user === "" || pass === "") {
                alert("Please fill all fields!");
                return false;
            }
            return true;
        }
    </script>

</head>

<body>

<div class="login-box">
    <div class="icon">🔐</div>
    <h2>SmartCab Login</h2>

    <form name="loginForm" action="/login" method="post" onsubmit="return validateLogin()">
        <input type="text" name="username" placeholder="Enter Email">
        <input type="password" name="password" placeholder="Enter Password">
        <button type="submit">Login</button>
    </form>

    <div class="footer">
        <p>Don't have an account? <a href="/register">Register</a></p>
    </div>
</div>

</body>
</html>
