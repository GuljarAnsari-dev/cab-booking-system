<!DOCTYPE html>
<html>
<head>
    <title>Booking History</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7fc;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background: #4facfe;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f1f1f1;
        }

        .price {
            color: green;
            font-weight: bold;
        }

    </style>
</head>

<body>

<h2>🚕 Booking History</h2>

<table>
    <tr>
        <th>Pickup</th>
        <th>Drop</th>
        <th>Fare (₹)</th>
    </tr>

    <tr th:each="b : ${bookings}">
        <td th:text="${b.pickup}"></td>
        <td th:text="${b.dropLocation}"></td>
        <td class="price" th:text="${b.price}"></td>
    </tr>

</table>

</body>
</html>
