<!DOCTYPE html>
<html>
<head>
    <title>SmartCab</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #007bff;
        }

        .icon {
            font-size: 40px;
        }

    </style>

    <script>
        function validateForm() {
            let pickup = document.forms["cabForm"]["pickup"].value;
            let drop = document.forms["cabForm"]["drop"].value;

            if (pickup === "" || drop === "") {
                alert("Please fill all fields!");
                return false;
            }

            if (pickup === drop) {
                alert("Pickup and Drop cannot be same!");
                return false;
            }

            return true;
        }
    </script>
</head>

<body>

<div class="container">
    <div class="icon">🚕</div>
    <h2>SmartCab Booking</h2>

    <form name="cabForm" action="/book" method="post" onsubmit="return validateForm()">

        <select name="pickup">
            <option value="">Select Pickup Location</option>
            <option>Kolkata</option>
            <option>Howrah</option>
            <option>Salt Lake</option>
            <option>New Town</option>
        </select>

        <select name="drop">
            <option value="">Select Drop Location</option>
            <option>Kolkata</option>
            <option>Howrah</option>
            <option>Salt Lake</option>
            <option>New Town</option>
        </select>

        <button type="submit">🚗 Book Ride</button>

    </form>
</div>

</body>
</html>
